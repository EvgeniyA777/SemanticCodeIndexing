name: MVP Runtime Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "proto/**"
      - "src-generated/**"
      - "contracts/**"
      - "fixtures/**"
      - "build.clj"
      - "deps.edn"
      - ".github/workflows/mvp-runtime.yml"
  push:
    # `dev` is the integration branch: everything lands there first and only
    # reaches `main` through a release PR. Without it here a push to `dev` ran
    # nothing at all, so work accumulated unverified until someone happened to
    # open a PR — which is exactly how CI stayed red from April to September.
    branches: ["main", "master", "dev"]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "proto/**"
      - "src-generated/**"
      - "contracts/**"
      - "fixtures/**"
      - "build.clj"
      - "deps.edn"
      - ".github/workflows/mvp-runtime.yml"

# While a PR is open, a push to `dev` fires this workflow twice on the same
# content: once for `push` and once for `pull_request`. Adding `dev` to
# `push.branches` was necessary (see the note above); the duplicate pair is its
# side effect, and it costs ~20 minutes of runner time per push.
#
# The key deliberately is NOT `github.ref`: that is `refs/heads/dev` for the push
# and `refs/pull/N/merge` for the pull_request, so the two events would land in
# different groups and nothing would collapse. `github.head_ref` is set only on
# `pull_request` (the source branch) and empty on `push`, so this expression
# resolves to the branch name for both and puts the pair in one group.
#
# Which of the two survives is decided by arrival order, not configured. In
# practice the `push` event is delivered 2-4 seconds before `pull_request`, so
# the `pull_request` run cancels the `push` run and the surviving run is the one
# the PR displays and the one that tests the merge commit. Nothing enforces that
# ordering; the repository has no branch protection or rulesets, so a cancelled
# run blocks nothing either way. To get the duplicate pair back for a flaky-test
# investigation — it is what proved the MCP teardown race in #3 — re-run the
# cancelled run from the Actions UI.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Setup tree-sitter grammars
        run: |
          ./scripts/setup-tree-sitter-grammars.sh --write-env-file .tree-sitter.env
          cat .tree-sitter.env >> "$GITHUB_ENV"

      # The benchmark agent's lexical arm shells out to ripgrep, and its
      # preflight refuses an arm whose tool is missing — which surfaced as the
      # live-runner contract test failing before any provider call, with an
      # empty usage matrix and an unresolved price.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # plans/018 Stages 3 and 4 ship provider adapters that shell out to a real
      # indexer. Without these toolchains their four end-to-end tests skipped and
      # the suite still reported green, so the CLI resolution chain, the
      # javac + semanticdb-javac + scip-semanticdb pipeline, and the freshness
      # gate against a live artifact ran in no environment at all — the same
      # shape as the Elixir lane defect fixed in #3.
      #
      # Both setup scripts fail closed on version drift: `npm ci` against the
      # committed lockfile, and sha256-verified pinned jars.
      - name: Setup scip-typescript toolchain
        run: |
          ./scripts/setup-scip-typescript.sh --write-env-file .scip.env
          cat .scip.env >> "$GITHUB_ENV"

      - name: Setup Java SCIP toolchain
        run: |
          ./scripts/setup-scip-java.sh --write-env-file .scip-java.env
          cat .scip-java.env >> "$GITHUB_ENV"

      - name: Verify generated gRPC sources
        run: clojure -T:build grpc-verify-generated

      - name: Run MVP Gates
        env:
          # Assert the end-to-end tests actually ran instead of trusting the
          # steps above: with this set, an unresolved SCIP toolchain fails the
          # test rather than printing a skip.
          SEMIDX_REQUIRE_SCIP_TOOLCHAINS: "1"
        run: ./scripts/run-mvp-gates.sh

  semantic-quality-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      - name: Run advisory semantic quality report
        run: ./scripts/run-semantic-quality-report.sh fixtures/semantic-quality/report-dataset.json .tmp/semantic-quality-report.json .tmp/semantic-quality-report-summary.md

      - name: Publish semantic quality summary
        if: always()
        run: |
          if [[ -f .tmp/semantic-quality-report-summary.md ]]; then
            cat .tmp/semantic-quality-report-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload semantic quality artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-quality-report
          path: |
            .tmp/semantic-quality-report.json
            .tmp/semantic-quality-report-summary.md

  runtime-gates-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: semantic_index_test
          POSTGRES_USER: semantic_user
          POSTGRES_PASSWORD: semantic_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U semantic_user -d semantic_index_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      # The narrowed namespace set still needs the tree-sitter toolchain
      # (semidx.integration.runtime-test) and ripgrep (benchmark-report-test).
      # This job previously ran without Node, the tree-sitter CLI, or the
      # grammars, which meant it was testing a degraded runtime and failing for
      # reasons that had nothing to do with PostgreSQL.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Setup tree-sitter grammars
        run: |
          ./scripts/setup-tree-sitter-grammars.sh --write-env-file .tree-sitter.env
          cat .tree-sitter.env >> "$GITHUB_ENV"

      # The benchmark agent's lexical arm shells out to ripgrep, and its
      # preflight refuses an arm whose tool is missing — which surfaced as the
      # live-runner contract test failing before any provider call, with an
      # empty usage matrix and an unresolved price.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # This job used to run the entire suite to gain 16 assertions, repeating
      # verbatim in the same runner image, on the same commit, what runtime-gates
      # had just run. Only four namespaces read SEMIDX_TEST_POSTGRES_URL, and
      # measurement confirms they hold the whole delta: the full suite is 3128
      # assertions without the variable and 3144 with it, while these four alone
      # are 821 without and 837 with. Everything else was a repeat.
      #
      # The job is narrowed, not deleted: the PostgreSQL path is what caught the
      # snapshot round-trip defect that reports/021 had carried as a known issue
      # since August and that #3 fixed.
      #
      # The SCIP toolchains are therefore not installed here either — none of
      # these four namespaces touches them.
      - name: Run PostgreSQL Integration Smoke
        env:
          SEMIDX_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/semantic_index_test?user=semantic_user&password=semantic_pass
        run: |
          clojure -M:test \
            -n semidx.integration.runtime-test \
            -n semidx.runtime.storage-test \
            -n semidx.runtime.fact-arbitration-test \
            -n semidx.runtime.benchmark-report-test
