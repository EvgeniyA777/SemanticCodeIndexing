name: MVP Runtime Gates

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "proto/**"
      - "src-generated/**"
      - "contracts/**"
      - "fixtures/**"
      - "build.clj"
      - "deps.edn"
      - ".github/workflows/mvp-runtime.yml"
  push:
    # `dev` is the integration branch: everything lands there first and only
    # reaches `main` through a release PR. Without it here a push to `dev` ran
    # nothing at all, so work accumulated unverified until someone happened to
    # open a PR — which is exactly how CI stayed red from April to September.
    branches: ["main", "master", "dev"]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "proto/**"
      - "src-generated/**"
      - "contracts/**"
      - "fixtures/**"
      - "build.clj"
      - "deps.edn"
      - ".github/workflows/mvp-runtime.yml"

jobs:
  runtime-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Setup tree-sitter grammars
        run: |
          ./scripts/setup-tree-sitter-grammars.sh --write-env-file .tree-sitter.env
          cat .tree-sitter.env >> "$GITHUB_ENV"

      # The benchmark agent's lexical arm shells out to ripgrep, and its
      # preflight refuses an arm whose tool is missing — which surfaced as the
      # live-runner contract test failing before any provider call, with an
      # empty usage matrix and an unresolved price.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # plans/018 Stages 3 and 4 ship provider adapters that shell out to a real
      # indexer. Without these toolchains their four end-to-end tests skipped and
      # the suite still reported green, so the CLI resolution chain, the
      # javac + semanticdb-javac + scip-semanticdb pipeline, and the freshness
      # gate against a live artifact ran in no environment at all — the same
      # shape as the Elixir lane defect fixed in #3.
      #
      # Both setup scripts fail closed on version drift: `npm ci` against the
      # committed lockfile, and sha256-verified pinned jars.
      - name: Setup scip-typescript toolchain
        run: |
          ./scripts/setup-scip-typescript.sh --write-env-file .scip.env
          cat .scip.env >> "$GITHUB_ENV"

      - name: Setup Java SCIP toolchain
        run: |
          ./scripts/setup-scip-java.sh --write-env-file .scip-java.env
          cat .scip-java.env >> "$GITHUB_ENV"

      - name: Verify generated gRPC sources
        run: clojure -T:build grpc-verify-generated

      - name: Run MVP Gates
        env:
          # Assert the end-to-end tests actually ran instead of trusting the
          # steps above: with this set, an unresolved SCIP toolchain fails the
          # test rather than printing a skip.
          SEMIDX_REQUIRE_SCIP_TOOLCHAINS: "1"
        run: ./scripts/run-mvp-gates.sh

  semantic-quality-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      - name: Run advisory semantic quality report
        run: ./scripts/run-semantic-quality-report.sh fixtures/semantic-quality/report-dataset.json .tmp/semantic-quality-report.json .tmp/semantic-quality-report-summary.md

      - name: Publish semantic quality summary
        if: always()
        run: |
          if [[ -f .tmp/semantic-quality-report-summary.md ]]; then
            cat .tmp/semantic-quality-report-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload semantic quality artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-quality-report
          path: |
            .tmp/semantic-quality-report.json
            .tmp/semantic-quality-report-summary.md

  runtime-gates-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: semantic_index_test
          POSTGRES_USER: semantic_user
          POSTGRES_PASSWORD: semantic_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U semantic_user -d semantic_index_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: "1.12.0.1530"
          # The Clojure lane is clj-kondo-primary with a regex fallback. Without
          # it every Clojure fixture degrades, which drops the confidence ceiling
          # from "high" to "low" and fails the retrieval, governance, and
          # semantic-quality assertions wholesale. Pinned rather than "latest" so
          # CI parses the same way a developer machine does.
          clj-kondo: "2026.01.19"

      # This job runs the same suite as runtime-gates, so it needs the same
      # toolchain. It previously ran without Node, the tree-sitter CLI, or the
      # grammars, which meant it was testing a degraded runtime and failing for
      # reasons that had nothing to do with PostgreSQL.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Setup tree-sitter grammars
        run: |
          ./scripts/setup-tree-sitter-grammars.sh --write-env-file .tree-sitter.env
          cat .tree-sitter.env >> "$GITHUB_ENV"

      # The benchmark agent's lexical arm shells out to ripgrep, and its
      # preflight refuses an arm whose tool is missing — which surfaced as the
      # live-runner contract test failing before any provider call, with an
      # empty usage matrix and an unresolved price.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # The SCIP toolchains are deliberately NOT installed here. This job runs
      # the same suite as runtime-gates, which already exercises the SCIP
      # end-to-end tests under SEMIDX_REQUIRE_SCIP_TOOLCHAINS; installing them
      # again would add an `npm ci` and eight jar downloads for no extra signal.
      # The four end-to-end tests skip in this job, and that is the intent.
      - name: Run PostgreSQL Integration Smoke
        env:
          SEMIDX_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/semantic_index_test?user=semantic_user&password=semantic_pass
        run: clojure -M:test
